name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      task:
        description: 'ci = normal checks; build-ru-dictionary = rebuild data/ru-typo*.txt and data/ru-pairs.bin from the pinned Leipzig packs and commit them to this branch; typo-final-test = the one-off held-out RU typo evaluation; dev-label-review = commit eval/dev_label_review.tsv (dev changes of words the gold standard kept) for an owner review'
        type: choice
        options: [ci, build-ru-dictionary, typo-final-test, dev-label-review]
        default: ci

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test tests/KeySwitch.Core.Tests -c Release --logger 'trx;LogFileName=core-linux.trx' --results-directory artifacts
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-linux
          path: artifacts/*.trx
          if-no-files-found: ignore

  # Russian typo correction on real misspellings (ai-forever/spellcheck_benchmark, MIT), downloaded on the
  # runner and never committed. Every run scores only the dev set (train splits), which all tuning uses.
  # The test splits are scored only by a manual `typo-final-test` run, once, after tuning is finished.
  typo-eval:
    name: Typo correction quality (RU, real typos)
    if: github.event_name != 'workflow_dispatch' || inputs.task != 'build-ru-dictionary'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FINAL_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'typo-final-test' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Download benchmark
        run: |
          base=https://huggingface.co/datasets/ai-forever/spellcheck_benchmark/resolve/main/data
          sets="dev:RUSpellRU/train dev:MultidomainGold/train"
          if [ "$FINAL_TEST" = true ]; then sets="$sets test:RUSpellRU/test test:MultidomainGold/test test:GitHubTypoCorpusRu/test"; fi
          for item in $sets; do
            part=${item%%:*}; f=${item#*:}
            mkdir -p "eval/$part/$(dirname $f)"; curl -fsSL --retry 3 -o "eval/$part/$f.json" "$base/$f.json"; done
          find eval -name '*.json' -exec sha256sum {} +
      # Until data/ru-typo.txt is committed (build-ru-dictionary), build it here the same way for evaluation.
      - name: Build RU word-form list (only if not bundled yet)
        if: hashFiles('data/ru-typo.txt') == ''
        run: |
          ./tools/fetch_leipzig.sh
          python3 tools/build_ru_typo_list.py data/ru-typo.txt 200000 leipzig/*.tar.gz
      # Same for the word-pair context table (data/ru-pairs.bin).
      - name: Build RU word-pair table (only if not bundled yet)
        if: hashFiles('data/ru-pairs.bin') == ''
        run: |
          [ -d leipzig ] || ./tools/fetch_leipzig.sh
          python3 tools/build_ru_pairs.py data/ru-typo.txt data/ru-pairs.bin 3 leipzig/*.tar.gz
      - name: Evaluate
        run: |
          dotnet build tools/KeySwitch.TypoEval -c Release -v q
          for part in dev $([ "$FINAL_TEST" = true ] && echo test); do
            # Dev only: also score with the owner's verdicts on changes of gold-kept words (eval/dev_label_review.tsv).
            review=$([ "$part" = dev ] && [ -f eval/dev_label_review.tsv ] && echo "--review eval/dev_label_review.tsv" || true)
            dotnet run --no-build --project tools/KeySwitch.TypoEval -c Release -- --pairs eval/$part.report.json $review $(find eval/$part -name '*.json' | sort) > /dev/null; done
      - name: Owner typos (regression set)
        run: |
          dotnet run --no-build --project tools/KeySwitch.TypoEval -c Release -- --owner tests/KeySwitch.Core.Tests/fixtures/owner_typos.txt > eval/owner.md
          { echo "## owner_typos"; echo; cat eval/owner.md; echo; } >> "$GITHUB_STEP_SUMMARY"
          cat eval/owner.md
      - name: Dev examples (for tuning)
        run: |
          python3 - <<'PY'
          import json
          for name, r in json.load(open("eval/dev.report.json")).items():
              if name == "realword":
                  print("--- word-pair context bundled:", r["PairContext"])
                  for probe, summary in r["Probes"].items():
                      print(f"--- real-word changes that were not right ({probe})")
                      for example in summary["Examples"]: print("  ", example)
                  continue
              if name == "variants": continue
              if name == "total":
                  print("--- dev by edit distance:", r["ByDistance"])
                  print("--- dev misses by reason:", r["MissReasons"])
                  print("--- dev typos that are real words, by confusion:", r["RealWordTypos"])
                  for example in r["RealWordExamples"]: print("  ", example)
                  continue
              for kind in ("WrongExamples", "FalseExamples", "MissExamples"):
                  print(f"--- {name} {kind}")
                  for example in r[kind][:25]: print("  ", example)
          PY
      - name: Summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          parts = ["dev"] + (["test"] if os.environ["FINAL_TEST"] == "true" else [])
          print("## RU typo correction on real misspellings\n")
          print("| set | file | typos | corrected | wrong | false on clean | change precision | recall | false rate |")
          print("|---|---|---:|---:|---:|---:|---:|---:|---:|")
          for part in parts:
              for name, r in json.load(open(f"eval/{part}.report.json")).items():
                  if name in ("variants", "realword"): continue
                  print(f"| {part} | {name} | {r['Typos']} | {r['Corrected']} | {r['WrongCorrections']} | {r['FalseCorrections']} "
                        f"| {r['ChangePrecision']:.2%} | {r['Recall']:.2%} | {r['FalseCorrectionRate']:.3%} |")
                  if r.get("Reviewed"):
                      v = r["Reviewed"]
                      print(f"| {part}, owner-reviewed labels | {name} ({v['Unreviewed']} unreviewed counted as false) | {v['Typos']} | {v['Corrected']} | {v['WrongCorrections']} | {v['FalseCorrections']} "
                            f"| {v['ChangePrecision']:.2%} | {v['Recall']:.2%} | {v['FalseCorrectionRate']:.3%} |")
          if "test" in parts:
              manual = json.load(open("eval/test.report.json"))["total"]["ManualSweep"]
              print("\n### Pause suggestions on the test split\n")
              print("| threshold | right among suggestions | typos fixed |")
              print("|---:|---:|---:|")
              for t, r in manual.items():
                  print(f"| {t} | {r['Accuracy']:.2%} | {r['Coverage']:.2%} |")
          pause = json.load(open("eval/dev.report.json"))["total"]["PauseOptions"]
          print(f"\nPause up to three presses (dev): intended spelling offered for {pause['Right']} typos ({pause['Coverage']:.2%}); some spelling offered for {pause['Offered']}.\n")
          print("\n### Auto-correction confidence threshold sweep (dev)\n")
          print("| threshold | precision | recall | false rate |")
          print("|---:|---:|---:|---:|")
          for t, r in json.load(open("eval/dev.report.json"))["total"]["Sweep"].items():
              print(f"| {t} | {r['Precision']:.2%} | {r['Recall']:.2%} | {r['FalseRate']:.3%} |")
          print("\n### Manual (Pause) suggestion threshold sweep (dev)\n")
          print("| threshold | right among suggestions | typos fixed |")
          print("|---:|---:|---:|")
          for t, r in json.load(open("eval/dev.report.json"))["total"]["ManualSweep"].items():
              print(f"| {t} | {r['Accuracy']:.2%} | {r['Coverage']:.2%} |")
          print("\n### Threshold variants (dev): right / wrong / changed-correct, precision, recall\n")
          print("| variant | lead | right | wrong | false | precision | recall | false rate |")
          print("|---|---:|---:|---:|---:|---:|---:|---:|")
          for name, sweep in json.load(open("eval/dev.report.json"))["variants"].items():
              for t, r in sweep.items():
                  print(f"| {name} | {t} | {r['Right']} | {r['Wrong']} | {r['FalseOnClean']} | {r['Precision']:.2%} | {r['Recall']:.2%} | {r['FalseRate']:.3%} |")
          realword = json.load(open("eval/dev.report.json"))["realword"]
          print(f"\n### Real-word errors by the previous word (dev; pair table bundled: {realword['PairContext']})\n")
          print("| min pairs | kind | lead | right | wrong | false | precision | false rate |")
          print("|---|---|---:|---:|---:|---:|---:|---:|")
          for probe, summary in realword["Probes"].items():
              for kind, sweep in summary["ByKind"].items():
                  for t, r in sweep.items():
                      print(f"| {probe} | {kind} | {t} | {r['Right']} | {r['Wrong']} | {r['FalseOnClean']} | {r['Precision']:.2%} | {r['FalseRate']:.3%} |")
          PY
          cat "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        uses: actions/upload-artifact@v5
        with:
          name: typo-eval
          path: |
            eval/*.report.json
            eval/*.false.tsv

  # Manual: commit the dev changes of words the gold standard kept, for an owner review (never the test split).
  dev-label-review:
    name: Dev label review file (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'dev-label-review'
    needs: typo-eval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: typo-eval
          path: typo-eval
      - name: Commit eval/dev_label_review.tsv to ${{ github.ref_name }}
        run: |
          # A file that is already under review is never overwritten.
          if [ -e eval/dev_label_review.tsv ]; then echo "::notice::eval/dev_label_review.tsv exists; not overwritten"; exit 0; fi
          mkdir -p eval
          cp typo-eval/dev.report.false.tsv eval/dev_label_review.tsv
          echo "$(grep -vc '^#' eval/dev_label_review.tsv) lines (with header)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/dev_label_review.tsv
          git commit -m "Dev label review: changes of words the gold standard kept (workflow_dispatch run ${{ github.run_id }})"
          git push origin "HEAD:${{ github.ref_name }}"

  # Manual: rebuild the RU typo word lists from the pinned Leipzig packs and commit them to the branch.
  ru-dictionary:
    name: Build RU typo dictionary (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'build-ru-dictionary'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download and verify Leipzig packs
        run: ./tools/fetch_leipzig.sh
      - name: Build lists
        run: |
          python3 tools/build_ru_typo_list.py data/ru-typo.txt 200000 leipzig/*.tar.gz
          python3 tools/build_ru_pairs.py data/ru-typo.txt data/ru-pairs.bin 3 leipzig/*.tar.gz
          cat data/ru-typo.manifest.txt data/ru-pairs.manifest.txt
      - name: Commit to ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ru-typo.txt data/ru-typo-seen.txt data/ru-typo.manifest.txt data/ru-pairs.bin data/ru-pairs.manifest.txt
          if git diff --cached --quiet; then echo "Lists unchanged"; exit 0; fi
          git commit -m "Build RU typo word-form lists and word-pair table from pinned Leipzig packs (workflow_dispatch run ${{ github.run_id }})"
          git push origin "HEAD:${{ github.ref_name }}"

  windows:
    name: Build, package, selftest (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/KeySwitch.App/KeySwitch.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($tag -ne $version) { Write-Error "Tag v$tag does not match <Version>$version</Version> in KeySwitch.App.csproj"; exit 1 }

      # Same script as local builds: tests, both win-x64 publishes, zips, checksums, PE/ZIP checks.
      - name: Build (tools/build.sh)
        shell: bash
        env:
          DOTNET_BIN: dotnet
          PYTHON: python
        run: ./tools/build.sh

      # Real Windows input path: WH_KEYBOARD_LL hook + SendInput + layout switch + typo correction.
      - name: Selftest (headless)
        shell: pwsh
        run: |
          $log = Join-Path $env:APPDATA 'KeySwitch\diag.log'
          $failed = @()
          foreach ($exe in 'dist\KeySwitch.exe', 'dist\small\KeySwitch.exe') {
            Write-Host "::group::selftest $exe"
            Remove-Item $log -ErrorAction SilentlyContinue
            $process = Start-Process -FilePath $exe -ArgumentList '--selftest', '--quiet' -PassThru
            $null = $process.Handle  # keep the handle so ExitCode is available after exit
            if (-not $process.WaitForExit(120000)) {
              $process.Kill()
              $failed += "$exe (timeout)"
            } elseif ($process.ExitCode -ne 0) {
              $failed += "$exe (exit $($process.ExitCode))"
            }
            if (Test-Path $log) { Get-Content $log } else { Write-Host 'diag.log not written' }
            Write-Host '::endgroup::'
          }
          if ($failed) { Write-Error ("Selftest failed: " + ($failed -join ', ')); exit 1 }
          Write-Host 'Selftest passed for both builds'

      - name: Upload packages
        uses: actions/upload-artifact@v5
        with:
          name: packages
          path: |
            dist/KeySwitch-win-x64.zip
            dist/KeySwitch-small.zip
            dist/SHA256SUMS-all
          if-no-files-found: error
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports-windows
          path: |
            artifacts/
          if-no-files-found: ignore

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: packages
          path: release
      # A release published from the GitHub UI creates the tag first; then only attach the files.
      - name: Create release or attach files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files='release/KeySwitch-win-x64.zip release/KeySwitch-small.zip release/SHA256SUMS-all'
          if gh release view '${{ github.ref_name }}' --repo '${{ github.repository }}' > /dev/null 2>&1; then
            gh release upload '${{ github.ref_name }}' $files --clobber --repo '${{ github.repository }}'
          else
            gh release create '${{ github.ref_name }}' $files \
              --repo '${{ github.repository }}' --title 'KeySwitch ${{ github.ref_name }}' --generate-notes
          fi
