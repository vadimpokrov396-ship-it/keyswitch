name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test tests/KeySwitch.Core.Tests -c Release --logger 'trx;LogFileName=core-linux.trx' --results-directory artifacts
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-linux
          path: artifacts/*.trx
          if-no-files-found: ignore

  # Russian typo correction on real misspellings (ai-forever/spellcheck_benchmark, MIT). The data is
  # downloaded on the runner and never committed. "dev" (train splits) is for tuning, "test" only for reporting.
  typo-eval:
    name: Typo correction quality (RU, real typos)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Download benchmark
        run: |
          base=https://huggingface.co/datasets/ai-forever/spellcheck_benchmark/resolve/main/data
          mkdir -p eval/dev eval/test
          for f in RUSpellRU/train MultidomainGold/train; do
            mkdir -p "eval/dev/$(dirname $f)"; curl -fsSL --retry 3 -o "eval/dev/$f.json" "$base/$f.json"; done
          for f in RUSpellRU/test MultidomainGold/test GitHubTypoCorpusRu/test; do
            mkdir -p "eval/test/$(dirname $f)"; curl -fsSL --retry 3 -o "eval/test/$f.json" "$base/$f.json"; done
          find eval -name '*.json' -exec sha256sum {} +
      - name: Evaluate (bundled word lists)
        run: |
          dotnet build tools/KeySwitch.TypoEval -c Release -v q
          dotnet run --no-build --project tools/KeySwitch.TypoEval -c Release -- --pairs eval/dev.report.json $(find eval/dev -name '*.json' | sort) > /dev/null
          dotnet run --no-build --project tools/KeySwitch.TypoEval -c Release -- --pairs eval/test.report.json $(find eval/test -name '*.json' | sort) > /dev/null
      # Candidate RU word-form list from the Leipzig packs already used for training (CC BY); evaluated before bundling.
      - name: Build RU word-form list
        if: hashFiles('data/ru-typo.txt') == ''
        run: |
          mkdir -p leipzig
          for pack in rus_news_2020_1M rus_wikipedia_2021_1M; do
            curl -fsSL --retry 3 -o "leipzig/$pack.tar.gz" "https://downloads.wortschatz-leipzig.de/corpora/$pack.tar.gz"; done
          python3 tools/build_ru_typo_list.py data/ru-typo.txt 200000 leipzig/*.tar.gz
          head -30 data/ru-typo.txt | tr '\n' ' '; echo
      - name: Evaluate (with RU word-form list)
        run: |
          dotnet build tools/KeySwitch.TypoEval -c Release -v q
          dotnet run --no-build --project tools/KeySwitch.TypoEval -c Release -- --pairs eval/dev.forms.report.json $(find eval/dev -name '*.json' | sort) > /dev/null
          dotnet run --no-build --project tools/KeySwitch.TypoEval -c Release -- --pairs eval/test.forms.report.json $(find eval/test -name '*.json' | sort) > /dev/null
      - name: Summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          print("## RU typo correction on real misspellings\n")
          print("| lists | set | file | typos | corrected | wrong | false on clean | change precision | recall | false rate |")
          print("|---|---|---|---:|---:|---:|---:|---:|---:|---:|")
          for variant, suffix in (("bundled", ""), ("+forms", ".forms")):
              for part in ("dev", "test"):
                  for name, r in json.load(open(f"eval/{part}{suffix}.report.json")).items():
                      print(f"| {variant} | {part} | {name} | {r['Typos']} | {r['Corrected']} | {r['WrongCorrections']} | {r['FalseCorrections']} "
                            f"| {r['ChangePrecision']:.2%} | {r['Recall']:.2%} | {r['FalseCorrectionRate']:.3%} |")
          PY
          cat "$GITHUB_STEP_SUMMARY"
      - name: Dev examples (for tuning; test examples are not printed)
        run: |
          python3 - <<'PY'
          import json
          for name, r in json.load(open("eval/dev.forms.report.json")).items():
              if name == "total":
                  print("--- dev by edit distance:", r["ByDistance"])
                  continue
              for kind in ("WrongExamples", "FalseExamples", "MissExamples"):
                  print(f"--- {name} {kind}")
                  for example in r[kind][:25]: print("  ", example)
          PY
      - name: Upload reports
        uses: actions/upload-artifact@v5
        with:
          name: typo-eval
          path: |
            eval/*.report.json
            data/ru-typo.txt

  windows:
    name: Build, package, selftest (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/KeySwitch.App/KeySwitch.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($tag -ne $version) { Write-Error "Tag v$tag does not match <Version>$version</Version> in KeySwitch.App.csproj"; exit 1 }

      # Same script as local builds: tests, both win-x64 publishes, zips, checksums, PE/ZIP checks.
      - name: Build (tools/build.sh)
        shell: bash
        env:
          DOTNET_BIN: dotnet
          PYTHON: python
        run: ./tools/build.sh

      # Real Windows input path: WH_KEYBOARD_LL hook + SendInput + layout switch + typo correction.
      - name: Selftest (headless)
        shell: pwsh
        run: |
          $log = Join-Path $env:APPDATA 'KeySwitch\diag.log'
          $failed = @()
          foreach ($exe in 'dist\KeySwitch.exe', 'dist\small\KeySwitch.exe') {
            Write-Host "::group::selftest $exe"
            Remove-Item $log -ErrorAction SilentlyContinue
            $process = Start-Process -FilePath $exe -ArgumentList '--selftest', '--quiet' -PassThru
            $null = $process.Handle  # keep the handle so ExitCode is available after exit
            if (-not $process.WaitForExit(120000)) {
              $process.Kill()
              $failed += "$exe (timeout)"
            } elseif ($process.ExitCode -ne 0) {
              $failed += "$exe (exit $($process.ExitCode))"
            }
            if (Test-Path $log) { Get-Content $log } else { Write-Host 'diag.log not written' }
            Write-Host '::endgroup::'
          }
          if ($failed) { Write-Error ("Selftest failed: " + ($failed -join ', ')); exit 1 }
          Write-Host 'Selftest passed for both builds'

      - name: Upload packages
        uses: actions/upload-artifact@v5
        with:
          name: packages
          path: |
            dist/KeySwitch-win-x64.zip
            dist/KeySwitch-small.zip
            dist/SHA256SUMS-all
          if-no-files-found: error
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports-windows
          path: |
            artifacts/
          if-no-files-found: ignore

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: packages
          path: release
      # A release published from the GitHub UI creates the tag first; then only attach the files.
      - name: Create release or attach files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files='release/KeySwitch-win-x64.zip release/KeySwitch-small.zip release/SHA256SUMS-all'
          if gh release view '${{ github.ref_name }}' --repo '${{ github.repository }}' > /dev/null 2>&1; then
            gh release upload '${{ github.ref_name }}' $files --clobber --repo '${{ github.repository }}'
          else
            gh release create '${{ github.ref_name }}' $files \
              --repo '${{ github.repository }}' --title 'KeySwitch ${{ github.ref_name }}' --generate-notes
          fi
