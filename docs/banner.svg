<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="KeySwitch: ghbdtn → привет">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#13254A"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22C55E"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
  </defs>
  <rect width="880" height="220" rx="22" fill="url(#bg)"/>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="48" y="78" fill="#FFFFFF" font-size="40" font-weight="800">Key<tspan fill="#22C55E">Switch</tspan></text>
    <text x="48" y="112" fill="#A9B7D0" font-size="17">RU ⇄ EN layout auto-switcher for Windows · offline · open source</text>
  </g>
  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="30" font-weight="700">
    <rect x="48" y="138" width="784" height="56" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="78" y="176" fill="#F87171">ghbdtn<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.45;0.95;1" dur="4s" repeatCount="indefinite"/></text>
    <text x="78" y="176" fill="#4ADE80" opacity="0">привет<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="4s" repeatCount="indefinite"/></text>
    <text x="330" y="176" fill="#7C8BA6" font-size="22" font-weight="400">→ Space → fixed, layout switched</text>
    <rect x="770" y="152" width="40" height="28" rx="6" fill="url(#acc)"/>
    <text x="777" y="173" fill="#0B1220" font-size="16" font-weight="800">RU<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="4s" repeatCount="indefinite"/></text>
    <text x="777" y="173" fill="#0B1220" font-size="16" font-weight="800">EN<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.45;0.95;1" dur="4s" repeatCount="indefinite"/></text>
  </g>
</svg>
